# Publishes a new version when the version number in LabWidge.csproj changes on main.
# The Setup file goes to the public repository Karalumpas/labwidge-releases, which the app checks for updates.
# Requires the secret RELEASES_TOKEN: a fine-grained token with "Contents: Read and write" on labwidge-releases.
name: Release

on:
  push:
    branches: [main]
    paths:
      - LabWidge/LabWidge.csproj
      - Setup/LabWidge.Setup.csproj
  workflow_dispatch:

permissions:
  contents: write # tag in this repository

concurrency:
  group: release
  cancel-in-progress: false

env:
  RELEASES_REPO: Karalumpas/labwidge-releases

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7

      - name: Read version
        id: version
        run: |
          $app = ([xml](Get-Content LabWidge/LabWidge.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          $setup = ([xml](Get-Content Setup/LabWidge.Setup.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          if ($app -ne $setup) { throw "The versions do not match: app $app, Setup $setup" }
          "version=$app" >> $env:GITHUB_OUTPUT
          Write-Host "Version $app"

      - name: Already released?
        id: exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "v${{ steps.version.outputs.version }}" -R $env:RELEASES_REPO *> $null
          $found = $LASTEXITCODE -eq 0
          "found=$($found.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          if ($found) { Write-Host "v${{ steps.version.outputs.version }} is already released – nothing to do." }
          exit 0

      - uses: actions/setup-dotnet@v6
        if: steps.exists.outputs.found == 'false'
        with:
          dotnet-version: 8.0.x

      - name: Build Setup
        if: steps.exists.outputs.found == 'false'
        run: ./install.ps1 -BuildOnly

      - name: Release notes from CHANGELOG.md
        if: steps.exists.outputs.found == 'false'
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $lines = Get-Content CHANGELOG.md -Encoding utf8
          $start = [array]::FindIndex($lines, [Predicate[string]] { param($l) $l.Trim() -eq "## $version" })
          $notes = @()
          if ($start -ge 0) {
            for ($i = $start + 1; $i -lt $lines.Count -and -not $lines[$i].StartsWith('## '); $i++) { $notes += $lines[$i] }
          }
          $body = if ($notes -join '' -match '\S') { "## What's new`n" + (($notes -join "`n").Trim()) } else { "Version $version." }
          $body += "`n`nRun ``LabWidge-Setup-$version.exe``. SmartScreen: `"More info`" → `"Run anyway`"."
          Set-Content notes.md $body -Encoding utf8

      - name: Publish
        if: steps.exists.outputs.found == 'false'
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          if (-not $env:GH_TOKEN) { throw 'The secret RELEASES_TOKEN is missing (Settings → Secrets and variables → Actions).' }
          $version = '${{ steps.version.outputs.version }}'
          # The file name carries the version, e.g. LabWidge-Setup-1.11.0.exe; the app finds any LabWidge-Setup*.exe
          Move-Item dist/LabWidge-Setup.exe "dist/LabWidge-Setup-$version.exe"
          gh release create "v$version" "dist/LabWidge-Setup-$version.exe" -R $env:RELEASES_REPO --title "LabWidge $version" --notes-file notes.md
          if ($LASTEXITCODE -ne 0) { throw 'gh release create failed' }

      - name: Tag the source
        if: steps.exists.outputs.found == 'false'
        run: |
          $tag = 'v${{ steps.version.outputs.version }}'
          if (-not (git ls-remote --tags origin $tag)) {
            git tag $tag
            git push origin $tag
          }
