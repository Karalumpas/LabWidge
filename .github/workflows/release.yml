# Publishes a new version when the version number in LabWidge.csproj changes on main.
# The Setup file goes to the public repository Karalumpas/labwidge-releases, which the app checks for updates.
# Requires the secret RELEASES_TOKEN: a fine-grained token with "Contents: Read and write" on labwidge-releases.
# Releases are unsigned. If SignPath is ever configured (docs/CODE_SIGNING.md), the app and Setup are signed instead.
name: Release

on:
  push:
    branches: [main]
    paths:
      - LabWidge/LabWidge.csproj
      - Setup/LabWidge.Setup.csproj
  workflow_dispatch:

permissions:
  contents: write # tag in this repository
  actions: read # SignPath verifies the GitHub-hosted build and retrieves its artifacts

concurrency:
  group: release
  cancel-in-progress: false

env:
  RELEASES_REPO: Karalumpas/labwidge-releases

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7

      - name: Read version
        id: version
        run: |
          $app = ([xml](Get-Content LabWidge/LabWidge.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          $setup = ([xml](Get-Content Setup/LabWidge.Setup.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          if ($app -ne $setup) { throw "The versions do not match: app $app, Setup $setup" }
          "version=$app" >> $env:GITHUB_OUTPUT
          Write-Host "Version $app"

      - name: Already released?
        id: exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "v${{ steps.version.outputs.version }}" -R $env:RELEASES_REPO *> $null
          $found = $LASTEXITCODE -eq 0
          "found=$($found.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          if ($found) { Write-Host "v${{ steps.version.outputs.version }} is already released – nothing to do." }
          exit 0

      - uses: actions/setup-dotnet@v6
        if: steps.exists.outputs.found == 'false'
        with:
          dotnet-version: 8.0.x

      - name: Signing configured?
        id: signing
        if: steps.exists.outputs.found == 'false'
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          SIGNPATH_SIGNING_POLICY_SLUG: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
        run: |
          $names = @('SIGNPATH_API_TOKEN', 'SIGNPATH_ORGANIZATION_ID', 'SIGNPATH_PROJECT_SLUG', 'SIGNPATH_SIGNING_POLICY_SLUG')
          $missing = @($names | Where-Object { -not [Environment]::GetEnvironmentVariable($_) })
          if ($missing.Count -eq $names.Count) { "signed=false" >> $env:GITHUB_OUTPUT; Write-Host 'SignPath is not configured – publishing an unsigned release.' }
          elseif ($missing.Count -gt 0) { throw "SignPath is only partly configured, missing: $($missing -join ', '). See docs/CODE_SIGNING.md." }
          else { "signed=true" >> $env:GITHUB_OUTPUT }

      - name: Build app
        if: steps.signing.outputs.signed == 'true'
        run: |
          dotnet publish LabWidge/LabWidge.csproj -c Release -o dist/unsigned-app --nologo -v q
          if ($LASTEXITCODE -ne 0) { throw 'Building the app failed' }

      - name: Upload app for signing
        if: steps.signing.outputs.signed == 'true'
        id: unsigned-app
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-app
          path: dist/unsigned-app/*
          if-no-files-found: error

      - name: Sign app
        if: steps.signing.outputs.signed == 'true'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: app
          github-artifact-id: ${{ steps.unsigned-app.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 7200
          output-artifact-directory: dist/signed-app
          parameters: |
            version: "${{ steps.version.outputs.version }}"

      - name: Build Setup with verified signed app
        if: steps.signing.outputs.signed == 'true'
        run: ./scripts/Build-SetupFromSignedApp.ps1 -AppDirectory dist/signed-app -Version '${{ steps.version.outputs.version }}'

      - name: Upload Setup for signing
        if: steps.signing.outputs.signed == 'true'
        id: unsigned-setup
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-setup
          path: dist/unsigned-setup/LabWidge-Setup.exe
          if-no-files-found: error

      - name: Sign Setup
        if: steps.signing.outputs.signed == 'true'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: setup
          github-artifact-id: ${{ steps.unsigned-setup.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 7200
          output-artifact-directory: dist/signed-setup
          parameters: |
            version: "${{ steps.version.outputs.version }}"

      - name: Verify signed Setup
        if: steps.signing.outputs.signed == 'true'
        run: ./scripts/Assert-ReleaseSignature.ps1 -Path dist/signed-setup/LabWidge-Setup.exe -Version '${{ steps.version.outputs.version }}'

      - name: Build unsigned Setup
        if: steps.signing.outputs.signed == 'false'
        run: |
          ./install.ps1 -BuildOnly
          New-Item -ItemType Directory -Force dist/signed-setup | Out-Null
          Move-Item dist/LabWidge-Setup.exe dist/signed-setup/LabWidge-Setup.exe

      - name: Release notes from CHANGELOG.md
        if: steps.exists.outputs.found == 'false'
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $lines = Get-Content CHANGELOG.md -Encoding utf8
          $start = [array]::FindIndex($lines, [Predicate[string]] { param($l) $l.Trim() -eq "## $version" })
          $notes = @()
          if ($start -ge 0) {
            for ($i = $start + 1; $i -lt $lines.Count -and -not $lines[$i].StartsWith('## '); $i++) { $notes += $lines[$i] }
          }
          $body = if ($notes -join '' -match '\S') { "## What's new`n" + (($notes -join "`n").Trim()) } else { "Version $version." }
          if ('${{ steps.signing.outputs.signed }}' -eq 'true') {
            $body += "`n`nRun ``LabWidge-Setup-$version.exe``. The installer and LabWidge binaries are digitally signed."
            $body += "`n`n[Code signing policy](https://github.com/Karalumpas/LabWidge/blob/main/CODE_SIGNING_POLICY.md)"
          } else {
            $body += "`n`nRun ``LabWidge-Setup-$version.exe``. It is not code-signed, so Windows may warn: choose `"More info`" → `"Run anyway`"."
          }
          Set-Content notes.md $body -Encoding utf8

      - name: Publish
        if: steps.exists.outputs.found == 'false'
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          if (-not $env:GH_TOKEN) { throw 'The secret RELEASES_TOKEN is missing (Settings → Secrets and variables → Actions).' }
          $version = '${{ steps.version.outputs.version }}'
          # The file name carries the version, e.g. LabWidge-Setup-1.11.0.exe; the app finds any LabWidge-Setup*.exe
          Move-Item dist/signed-setup/LabWidge-Setup.exe "dist/LabWidge-Setup-$version.exe"
          gh release create "v$version" "dist/LabWidge-Setup-$version.exe" -R $env:RELEASES_REPO --title "LabWidge $version" --notes-file notes.md
          if ($LASTEXITCODE -ne 0) { throw 'gh release create failed' }

      - name: Tag the source
        if: steps.exists.outputs.found == 'false'
        run: |
          $tag = 'v${{ steps.version.outputs.version }}'
          if (-not (git ls-remote --tags origin $tag)) {
            git tag $tag
            git push origin $tag
          }
